<!doctype html><meta charset="utf-8"><title>transfer</title>
<script>
// Hands files from this site to the Instagram tab that opened it (Instagram's own page cannot fetch other sites).
// Usage: window.open('https://simplefunction-lab.github.io/share/xfer.html?f=a.mp4,b.jpg') from instagram.com
(async () => {
  const names = (new URLSearchParams(location.search).get('f') || '').split(',').filter(Boolean);
  const files = [];
  for (const name of names) { const res = await fetch(name); files.push({ name, type: res.headers.get('content-type'), blob: await res.blob() }); }
  if (window.opener) window.opener.postMessage({ kind: 'xfer', files }, 'https://www.instagram.com');
  document.body.textContent = 'sent ' + files.length;
})();
</script>
